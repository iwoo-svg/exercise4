<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4 — Letterform E</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="canvas">

    <!-- 1. stripes -->
    <div class="letter stripes">
        <div class="stripe-row">
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
        </div>
        <div class="stripe-row">
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
        </div>
        <div class="stripe-row">
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
          <div class="stripe"></div>
        </div>
    </div>

    <!-- 2. square dots -->
    <div class="letter squares">
        <div class="spine">
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
        </div>
        <div class="arm">
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
        </div>
        <div class="arm">
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
        </div>
        <div class="arm">
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
          <div class="sq"></div>
        </div>
    </div>

    <!-- 3. bars -->
    <div class="letter bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <!-- 4. ovals -->
    <div class="letter ovals">
      <div class="oval"></div>
      <div class="oval"></div>
      <div class="oval"></div>
    </div>

    <!-- 5. dot grid -->
    <div class="letter dots">
        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot hollow"></div>
          <div class="dot hollow"></div>
          <div class="dot hollow"></div>
        </div>
        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot hollow"></div>
        </div>
        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot hollow"></div>
          <div class="dot hollow"></div>
          <div class="dot hollow"></div>
        </div>
        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
    </div>

  </div>

</body>
</html>
